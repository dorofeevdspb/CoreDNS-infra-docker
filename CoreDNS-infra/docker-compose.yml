version: "3.9"

services:
  dns-infra:
    image: coredns/coredns:latest
    container_name: dns-infra
    restart: unless-stopped
#    ports:
#      - "53:53/tcp"
#      - "53:53/udp"
    volumes:
      - ./coredns:/etc/coredns:ro
    command: ["-conf", "/etc/coredns/Corefile"]
    networks:
      dns-infra:
        ipv4_address: 172.20.102.10

networks:
  dns-infra:
    external: true